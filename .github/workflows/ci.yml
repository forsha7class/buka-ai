name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the job only reads the checkout.
permissions:
  contents: read

# Supersede in-flight runs for the same ref instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The unit and integration suites are fully offline: no provider, no network.
# `npm run test:smoke` is deliberately excluded — it needs a live model.
jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI boots
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null

  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Syntax check
        run: bash -n install.sh

      - name: Install from checkout
        run: |
          export BUKA_BIN_DIR="$RUNNER_TEMP/bin"
          ./install.sh
          "$BUKA_BIN_DIR/buka" --version
          "$BUKA_BIN_DIR/buka" --help > /dev/null

      - name: Uninstall launcher
        run: |
          export BUKA_BIN_DIR="$RUNNER_TEMP/bin"
          ./install.sh --uninstall
          test ! -e "$BUKA_BIN_DIR/buka"
